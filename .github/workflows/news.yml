# IBRA STORE — يسأل الموقع كل ساعة: هل أنشر أخبار الآن؟
# كل الإعدادات (المصادر/العدد/الفاصل/أوقات النشر) تُدار من لوحة الإدارة.
name: news

on:
  schedule:
    - cron: "0 * * * *"     # كل ساعة — الموقع هو من يقرر هل ينشر فعلاً
  workflow_dispatch:          # تشغيل يدوي فوري

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: ${{ vars.SITE_URL || 'https://ibraprogram.netlify.app' }}
      ADMIN_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: تثبيت rss-parser
        run: npm init -y >/dev/null 2>&1 && npm i rss-parser@3 --silent
      - name: جلب ونشر الأخبار
        run: node .github/scripts/fetch-news.mjs
