<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBRA STORE — برامج وتطبيقات ابراهيم الخزرجي</title>
<meta name="description" content="حمّل برامج وتطبيقات ابراهيم الخزرجي المجانية لويندوز وأندرويد وآيفون وغيرها، بروابط تحميل متعددة.">
<meta name="keywords" content="برامج, تطبيقات, ويندوز, أندرويد, ابراهيم الخزرجي, IBRAPROGRAM">
<meta name="theme-color" content="#07070a">
<meta property="og:title" content="IBRA STORE — برامج وتطبيقات ابراهيم الخزرجي">
<meta property="og:description" content="برامج مجانية لكل الأجهزة بروابط تحميل متعددة">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>try{var t=localStorage.getItem("ib_theme");if(t&&t!=="gold")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
/* ===== بحث علوي بالشريط ===== */
.navsearch{display:none;align-items:center;gap:8px;flex:1;max-width:360px;padding:0 14px;height:42px;border-radius:999px;border:1px solid var(--line2);background:var(--input-bg)}
body.is-home .navsearch{display:flex}
body.is-home .nav-links{margin-inline-start:0}
.navsearch:focus-within{border-color:var(--gold)}
#layWrap{display:none}
body.is-home #layWrap{display:block}
#layMenu{min-width:190px}
#layMenu button svg{width:18px;height:18px;color:var(--gold);flex:none}
.navsearch .ns-ic{display:grid;place-items:center;color:var(--gold);flex:none}
.navsearch .ns-ic svg{width:18px;height:18px}
.navsearch input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:.92rem}
@media(max-width:860px){.nav .wrap{flex-wrap:wrap}.navsearch{max-width:none;order:5;flex-basis:100%;margin:4px 0 0}}

/* ===== هيرو مصغّر (سطر عنوان) ===== */
.hero-mini{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding:18px 2px 10px}
.hero-mini .hm-text{flex:1;min-width:240px}
.hero-mini h1{font-family:var(--head);font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.3;display:inline}
.hero-mini p{color:var(--muted);font-size:.9rem;margin-top:4px}
.hero-mini .badges{margin-top:0;gap:8px 16px}
.hero-mini .badges span{font-size:.82rem}
@media(max-width:700px){.hero-mini{padding:12px 2px 8px}.hero-mini .badges{display:none}}
.searchbar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px}
.searchbar svg{width:22px;height:22px;color:var(--gold);margin-inline-start:10px;flex:none}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1rem;padding:8px 0}
.stats{display:flex;justify-content:center;gap:34px;margin-top:30px;flex-wrap:wrap}
.stats div{text-align:center}
.stats b{display:block;font-family:var(--head);font-size:1.7rem}
.stats span{color:var(--dim);font-size:.85rem}


.featured{display:grid;grid-template-columns:1.1fr 1fr;gap:0;overflow:hidden;margin-bottom:28px;cursor:pointer;transition:.3s}
.featured:hover{border-color:var(--line)}
.featured .media{min-height:280px;background:var(--bg2) center/cover no-repeat;position:relative}
.featured .media::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,transparent 40%,var(--bg2))}
.featured .info{padding:34px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.featured h2{font-family:var(--head);font-size:2rem;line-height:1.3}
@media(max-width:820px){.featured{grid-template-columns:1fr}.featured .media{min-height:200px}.featured .media::after{background:linear-gradient(0deg,var(--bg2),transparent 60%)}}

.viewbar{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin:2px 0 16px}
.viewbar button{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;font-weight:700;font-size:.82rem;transition:.2s}
.viewbar button svg{width:16px;height:16px}
.viewbar button:hover{color:var(--text)}
.viewbar button.on{color:var(--gold3);border-color:var(--gold);background:var(--gold-dim)}
@media(max-width:560px){.viewbar .vbl{display:none}.viewbar button{padding:9px 12px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
/* عرض الصور */
.cover-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ccard{padding:0;overflow:hidden}
.ccard .cv{height:160px;background:var(--bg2) center/cover no-repeat;border-bottom:1px solid var(--line2)}
.ccard .cbody{padding:18px;display:flex;flex-direction:column;gap:12px;flex:1}
/* عرض قائمة */
.applist{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:16px;padding:14px 18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.lrow:hover{transform:translateX(-3px);border-color:var(--line)}
.lrow .app-icon{width:56px;height:56px}
.lrow .lx{flex:1;min-width:0}
.lrow .lx h3{font-size:1.08rem;display:flex;align-items:center;gap:8px}
.lrow .lx p{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lr{display:flex;align-items:center;gap:14px;flex:none}
.btn.sm{padding:7px 14px;font-size:.85rem}
@media(max-width:620px){.lrow .lr .btn{display:none}.lrow .lr{gap:8px}}
/* أقسام */
.cat-sec{margin-bottom:32px}
.cat-h{font-family:var(--head);font-size:1.3rem;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.cat-h::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(var(--gold3),var(--gold2))}

/* ===== شريط اختيار التصميم ===== */
.laybar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 0 2px}
.laybar .lbt{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:.85rem;margin-inline-end:4px}
.laybar .lbt svg{width:17px;height:17px;color:var(--gold)}
.laybar button{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;font-weight:700;font-size:.82rem;transition:.2s}
.laybar button svg{width:16px;height:16px}
.laybar button:hover{color:var(--text)}
.laybar button.on{color:var(--gold3);border-color:var(--gold);background:var(--gold-dim)}
@media(max-width:560px){.laybar .vbl{display:none}}

/* ===== شارات المميزات + رقائق القسم بالهيرو ===== */
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-top:22px}
.badges span{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.9rem;font-weight:600}
.badges svg{width:18px;height:18px;color:var(--gold)}
.hero-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 20px;max-width:720px}
.hero-chips button{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--text);cursor:pointer;font-weight:600;font-size:.86rem;transition:.2s}
.hero-chips button svg{width:16px;height:16px;color:var(--gold)}
.hero-chips button:hover{border-color:var(--gold);background:var(--gold-dim);color:var(--gold3)}

/* ===== شريط الأقسام الأفقي ===== */
.catstrip{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 18px;scrollbar-width:none}
.catstrip::-webkit-scrollbar{display:none}
.catstrip .cs{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;width:92px;padding:12px 8px;border-radius:14px;border:1px solid var(--line2);background:var(--glass-grad);cursor:pointer;color:var(--text);font-weight:700;font-size:.8rem;transition:.25s;backdrop-filter:blur(12px)}
.catstrip .cs svg{width:22px;height:22px;color:var(--gold)}
.catstrip .cs:hover{transform:translateY(-3px);border-color:var(--line)}
.catstrip .cs.on{background:linear-gradient(145deg,var(--gold-dim),transparent);border-color:var(--gold);color:var(--gold3)}
.catstrip .cs.on svg{color:var(--gold3)}

/* ===== شريط الإحصائيات ===== */
.statsbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px;margin:4px 0 8px;text-align:center}
.statsbar b{display:block;font-family:var(--head);font-size:1.7rem}
.statsbar span{color:var(--dim);font-size:.85rem}
@media(max-width:560px){.statsbar{grid-template-columns:repeat(2,1fr);gap:18px}}

/* ===== عناوين الأقسام ===== */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-head h2{font-family:var(--head);font-size:1.35rem;display:flex;align-items:center;gap:10px}
.sec-head h2 svg{width:22px;height:22px;color:var(--gold)}

/* ===== القوائم الجانبية ===== */
.side-box{padding:18px}
.side-box .sb-h{font-family:var(--head);font-size:1.1rem;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.side-box .sb-h svg{width:20px;height:20px;color:var(--gold)}
.catlist,.sortlist{display:flex;flex-direction:column;gap:4px}
.catlist button,.sortlist button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:11px;border:0;background:none;cursor:pointer;color:var(--text);font-weight:600;font-size:.92rem;text-align:start;transition:.15s;width:100%}
.catlist button span,.sortlist button{display:flex;align-items:center;gap:9px}
.catlist button svg,.sortlist button svg{width:17px;height:17px;color:var(--gold)}
.catlist button b{color:var(--dim);font-size:.8rem;font-weight:700}
.catlist button:hover,.sortlist button:hover{background:var(--panel)}
.catlist button.on,.sortlist button.on{background:var(--gold-dim);color:var(--gold3)}
.catlist button.on b{color:var(--gold3)}
.recentlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:12px;padding:9px;border-radius:12px;cursor:pointer;transition:.15s}
.ritem:hover{background:var(--panel)}
.ritem .app-icon{width:44px;height:44px;border-radius:12px;font-size:1.1rem}
.ritem b{display:block;font-size:.93rem}
.ritem small{color:var(--dim);font-size:.78rem}
.dlcounter{margin-top:16px;padding:16px;border-radius:14px;background:var(--gold-dim);border:1px solid var(--line);text-align:center}
.dlcounter span{display:block;color:var(--muted);font-size:.85rem;margin-bottom:4px}
.dlcounter b{font-family:var(--head);font-size:1.7rem}

/* ===== شبكات التصاميم ===== */
.d1wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.d2wrap{display:grid;grid-template-columns:250px minmax(0,1fr) 260px;gap:20px;align-items:start}
.d3wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}
.d1wrap>*,.d2wrap>*,.d3wrap>*{min-width:0}
.d2wrap .side-box,.d1wrap aside .side-box,.d3wrap aside .side-box{position:sticky;top:84px}
@media(max-width:1040px){.d2wrap{grid-template-columns:240px minmax(0,1fr)}.d2wrap>aside:last-child{display:none}}
@media(max-width:840px){.d1wrap,.d2wrap,.d3wrap{grid-template-columns:1fr}.d1wrap aside,.d2wrap>aside,.d3wrap aside{order:-1}.d3wrap aside{order:1}.side-box{position:static!important}}

/* ===== بطاقة المتجر (للتصاميم) ===== */
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.store-grid.tight{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.scard{position:relative;padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;cursor:pointer;transition:.3s cubic-bezier(.2,.7,.2,1);overflow:hidden}
.scard:hover{transform:translateY(-5px);border-color:var(--line)}
.scard .ribbon{position:absolute;top:12px;inset-inline-start:-30px;transform:rotate(-45deg);background:linear-gradient(135deg,var(--acc-hi),var(--gold));color:var(--on-accent);font-size:.68rem;font-weight:800;padding:3px 34px}
.scard .si .app-icon{width:70px;height:70px;border-radius:19px;font-size:1.9rem}
.scard h3{font-size:1.05rem;line-height:1.3}
.scard p{color:var(--muted);font-size:.83rem;min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .smeta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
.scard .smeta .plat-icons span{width:26px;height:26px}
.scard .smeta .plat-icons svg{width:14px;height:14px}
.scard .dl-count{font-size:.78rem}
.scard .dlbtn{width:100%;margin-top:auto}
.scard .rating{justify-content:center}

/* ===== النجوم ===== */
.rating{display:inline-flex;align-items:center;gap:6px}
.rating .stars{display:inline-flex;gap:1px}
.rating .st{width:15px;height:15px;fill:var(--line2);stroke:none;flex:none}
.rating .st.f{fill:#f1b739}
.rating .rnum{font-size:.82rem;color:var(--muted);font-weight:700}
.rating .rnum small{color:var(--dim);font-weight:400}
.rating .rnum.dimtxt{color:var(--dim);font-weight:600}
.app-head .meta .rating{padding:4px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line2)}
.rate-box{padding:18px;margin-top:22px;text-align:center}
.rate-box h3{font-family:var(--head);font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.rate-box h3 svg{width:20px;height:20px;fill:var(--gold);stroke:none}
.rate-stars{display:inline-flex;gap:6px;margin-bottom:10px}
.rate-stars button{background:none;border:0;cursor:pointer;padding:2px;line-height:0}
.rate-stars .st{width:34px;height:34px;fill:var(--line2);stroke:none;transition:.12s}
.rate-stars button.f .st{fill:#f1b739;filter:drop-shadow(0 2px 6px rgba(241,183,57,.4))}
.rate-stars button:hover{transform:scale(1.12)}
.rate-info{color:var(--muted);font-size:.9rem}
.rate-info b{color:var(--gold3);font-family:var(--head)}
.rate-info .minetag{display:inline-block;margin-inline-start:6px;padding:2px 10px;border-radius:999px;background:var(--gold-dim);color:var(--gold3);font-size:.78rem}
.card{padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.3s cubic-bezier(.2,.7,.2,1);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,var(--gold),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.3s}
.card:hover{transform:translateY(-4px)}
.card:hover::before{opacity:1}
.card .top{display:flex;gap:14px;align-items:center}
.app-icon{width:62px;height:62px;border-radius:17px;flex:none;object-fit:cover;background:linear-gradient(145deg,#1d1a12,#0b0b0d);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--head);font-size:1.6rem;color:var(--gold);overflow:hidden}
.app-icon img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:1.12rem;line-height:1.35}
.card .tag{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.card .bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line2)}
.plat-icons{display:flex;gap:6px}
.plat-icons span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line2);color:var(--gold3)}
.plat-icons svg{width:16px;height:16px}
.dl-count{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:.82rem}
.dl-count svg{width:15px;height:15px}
.badge-feat{position:absolute;top:14px;left:14px;font-size:.72rem;padding:3px 10px;border-radius:999px;background:var(--gold-dim);color:var(--gold3);border:1px solid var(--line)}

/* ===== صفحة التطبيق ===== */
.app-head{display:flex;gap:24px;align-items:center;padding:30px;margin:26px 0 22px;flex-wrap:wrap}
.app-head .app-icon{width:110px;height:110px;border-radius:28px;font-size:2.8rem}
.app-head h1{font-family:var(--head);font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.3}
.app-head .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.app-head .actions{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap}
.app-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.app-layout>*{min-width:0}
@media(max-width:960px){.app-layout{grid-template-columns:1fr}.side{order:-1}}
.box{padding:24px;margin-bottom:22px}
.box h2{font-family:var(--head);font-size:1.25rem;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.box h2::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(var(--gold3),var(--gold2))}
.desc{color:var(--text);opacity:.92;white-space:pre-line;font-size:1.02rem}
.plat-note{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;margin-bottom:12px;border-radius:12px;background:var(--gold-dim);border:1px solid var(--line);color:var(--gold3);font-size:.88rem;line-height:1.6}
.plat-note svg{width:17px;height:17px;flex:none;margin-top:3px}
.desc ul{margin:8px 0;padding-inline-start:22px}
.features{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.features div{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r2);background:var(--panel);border:1px solid var(--line2);font-size:.95rem}
.features svg{width:18px;height:18px;color:var(--gold);flex:none;margin-top:4px}

.shots{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.shots img{height:240px;width:auto;max-width:none;border-radius:var(--r2);border:1px solid var(--line2);cursor:zoom-in;scroll-snap-align:start;transition:.25s;background:var(--bg2)}
.shots img:hover{border-color:var(--gold)}
.video{border-radius:var(--r2);overflow:hidden;border:1px solid var(--line2);background:#000}
.video iframe,.video video{width:100%;aspect-ratio:16/9;border:0;display:block}

.dl-panel{padding:22px;position:sticky;top:84px}
.dl-panel h2{font-family:var(--head);font-size:1.25rem;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.dl-panel h2 svg{width:22px;height:22px;color:var(--gold)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptabs button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:700;color:var(--muted);font-size:.88rem}
.ptabs button svg{width:17px;height:17px}
.ptabs button.on{border-color:var(--gold);color:var(--gold3);background:var(--gold-dim)}
.mirrors{display:flex;flex-direction:column;gap:10px}
.mirror{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--sunken);transition:.2s}
.mirror:hover{border-color:var(--gold);background:var(--gold-dim);transform:translateX(-3px)}
.mirror .dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800;font-size:.9rem}
.mirror b{display:block;font-size:.98rem}
.mirror small{color:var(--dim);font-size:.78rem}
.mirror .go{margin-inline-start:auto;color:var(--gold)}
.mirror .go svg{width:20px;height:20px}
.mirror.first{background:var(--gold-dim);border-color:var(--line)}
.mirror-wrap{display:flex;flex-direction:column;gap:2px}
.report-link{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;background:none;border:0;cursor:pointer;color:var(--dim);font-size:.76rem;font-weight:600;padding:3px 6px;margin-bottom:4px;border-radius:8px;transition:.2s}
.report-link svg{width:13px;height:13px}
.report-link:hover{color:var(--warn)}
.report-link.done{color:var(--ok);pointer-events:none}
.info-list{display:grid;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2);font-size:.92rem}
.info-list div{display:flex;justify-content:space-between;gap:10px}
.info-list span{color:var(--dim)}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw a{padding:5px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);color:var(--muted);font-size:.85rem;transition:.2s}
.kw a:hover{color:var(--gold3);border-color:var(--line)}
.share{display:flex;gap:8px;flex-wrap:wrap}

.lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-height:90vh;max-width:95vw;border-radius:12px;box-shadow:var(--shadow)}
.lightbox button{position:absolute;background:rgba(255,255,255,.08);border:1px solid var(--line2);border-radius:50%;width:48px;height:48px;cursor:pointer;display:grid;place-items:center}
.lightbox button svg{width:22px;height:22px}
.lb-x{top:20px;left:20px}.lb-p{right:20px;top:50%}.lb-n{left:20px;top:50%}

/* ===== الطلبات ===== */
.req-layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:22px;align-items:start}
.req-layout>*{min-width:0}
@media(max-width:900px){.req-layout{grid-template-columns:1fr}}
.req-form{padding:24px;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:var(--sunken);border:1px solid var(--line2)}
.mode-switch button{padding:9px;border-radius:10px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--muted)}
.mode-switch button.on{background:var(--gold-dim);color:var(--gold3);box-shadow:inset 0 0 0 1px var(--line)}
.me-box{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line2)}
.me-box svg{width:20px;height:20px;color:var(--gold)}
.req{padding:18px 20px;display:flex;gap:16px;margin-bottom:14px}
.vote{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;height:66px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;transition:.2s;flex:none}
.vote svg{width:20px;height:20px}
.vote b{font-size:1rem;line-height:1}
.vote:hover,.vote.on{border-color:var(--gold);color:var(--gold3);background:var(--gold-dim)}
.req h3{font-size:1.05rem;margin-bottom:4px}
.req p{color:var(--muted);font-size:.93rem;white-space:pre-line}
.req .rmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;font-size:.8rem;color:var(--dim)}
.reply{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--gold-dim);border:1px solid var(--line);font-size:.92rem}
.done-app{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,var(--gold-dim),transparent);border:1px solid var(--gold);transition:.2s}
.done-app:hover{background:var(--gold-dim);transform:translateY(-1px)}
.done-app img,.done-app .di{width:44px;height:44px;border-radius:12px;flex:none;object-fit:cover;background:var(--logo-grad);display:grid;place-items:center;color:var(--gold);font-family:var(--head);font-size:1.3rem;border:1px solid var(--line)}
.done-app .dt{flex:1;min-width:0}
.done-app .dt b{display:block;color:var(--gold3)}
.done-app .dt small{color:var(--muted);font-size:.8rem}
.done-app svg{width:22px;height:22px;color:var(--gold);flex:none}
.reply b{color:var(--gold3)}
.st{padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;border:1px solid}
.st-new{color:var(--info);border-color:rgba(127,182,255,.35)}
.st-review{color:var(--warn);border-color:rgba(240,181,74,.35)}
.st-progress{color:var(--gold3);border-color:var(--line)}
.st-done{color:var(--ok);border-color:rgba(95,209,154,.35)}
.st-rejected{color:var(--bad);border-color:rgba(255,107,107,.35)}

/* ===== حول ===== */
.dev{display:grid;grid-template-columns:auto 1fr;gap:30px;padding:36px;align-items:center;margin-top:26px}
@media(max-width:700px){.dev{grid-template-columns:1fr;text-align:center}.dev .links{justify-content:center}}
.dev-avatar{width:150px;height:150px;border-radius:40px;display:grid;place-items:center;margin:auto;background:var(--logo-grad);border:1px solid var(--line);font-family:var(--head);font-size:4rem;box-shadow:0 20px 60px -20px var(--acc-glow)}
.dev h1{font-family:var(--head);font-size:2.2rem}
.dev .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.credit{text-align:center;padding:30px;margin-top:22px}
.credit .big{font-family:var(--head);font-size:1.5rem;margin-bottom:12px}
.notice{padding:12px 18px;border-radius:14px;background:var(--gold-dim);border:1px solid var(--line);color:var(--gold3);text-align:center;margin-top:16px;font-weight:600}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="brand" href="/" data-link>
      <div class="logo"><span class="gold-text">IB</span></div>
      <div><b class="gold-text" id="siteName">IBRA STORE</b><small id="siteSub">برامج وتطبيقات ابراهيم الخزرجي</small></div>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="/" data-link data-nav="home">الرئيسية</a>
      <a href="/requests" data-link data-nav="requests">طلبات التطبيقات</a>
      <a href="/about" data-link data-nav="about">عن المطور</a>
    </nav>
    <div class="navsearch"><span class="ns-ic" id="nsIc"></span><input id="navq" placeholder="ابحث عن برنامج…" autocomplete="off"></div>
    <div class="theme-wrap" id="layWrap"><button class="theme-btn" id="layBtn" aria-label="تغيير التصميم"></button><div class="theme-menu" id="layMenu"></div></div>
    <div class="theme-wrap"><button class="theme-btn" id="themeBtn" aria-label="تغيير الثيم"></button><div class="theme-menu" id="themeMenu"></div></div>
    <button class="burger" id="burger" aria-label="القائمة"></button>
  </div>
</header>

<main id="view" class="wrap"><div class="spinner"></div></main>

<footer class="footer">
  <div class="wrap">
    <span>برمجة وتطوير <b class="gold-text">ابراهيم الخزرجي</b> · © <span id="yr"></span></span>
    <span style="display:flex;gap:14px">
      <a id="fTg" href="https://t.me/ibraprogram" target="_blank" rel="noopener">تيليكرام</a>
      <a id="fTt" href="https://www.tiktok.com/@ibraprogram" target="_blank" rel="noopener">تيك توك</a>
    </span>
  </div>
</footer>

<div class="lightbox" id="lb">
  <button class="lb-x" id="lbX" aria-label="إغلاق"></button>
  <button class="lb-p" id="lbP" aria-label="السابق"></button>
  <img id="lbImg" alt="">
  <button class="lb-n" id="lbN" aria-label="التالي"></button>
</div>

<div class="modal-bg" id="authModal">
  <div class="modal glass">
    <h3 id="authTitle">تسجيل الدخول</h3>
    <div class="mode-switch" style="margin-bottom:16px">
      <button id="tabLogin" class="on">دخول</button>
      <button id="tabReg">حساب جديد</button>
    </div>
    <form id="authForm" style="display:flex;flex-direction:column;gap:12px">
      <div class="field" id="fName" hidden><label>اسمك (يظهر مع طلباتك)</label><input class="input" name="name" maxlength="50"></div>
      <div class="field"><label>اسم المستخدم (إنكليزي)</label><input class="input" name="username" dir="ltr" autocomplete="username" required></div>
      <div class="field"><label>كلمة السر</label><input class="input" name="password" type="password" dir="ltr" autocomplete="current-password" required></div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="btn gold" style="flex:1" type="submit" id="authBtn">دخول</button>
        <button class="btn ghost" type="button" id="authClose">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script src="/shared.js"></script>
<script>
const { icons: I, PLATFORMS, HOSTS, catIcon, esc, api, toast, fmtDate, fmtAgo, fmtNum, copy, videoEmbed } = IB;
const $ = (s, r = document) => r.querySelector(s);
const view = $("#view");
let S = {}, APPS = null, USER = null;
let state = { q: "", plat: "all", cat: "all", view: null, layout: null, sort: "default" };
let homeDraw = null;
const appCats = (a) => (a.categories && a.categories.length ? a.categories : (a.category ? [a.category] : []));
const VIEWS = {
  grid: { name: "مربعات", icon: I.grid },
  cover: { name: "صور", icon: I.image },
  list: { name: "قائمة", icon: I.menu },
  sections: { name: "أقسام", icon: I.tag },
};
const LAYOUTS = {
  d1: { name: "تصميم ١", icon: I.layout },
  d2: { name: "تصميم ٢", icon: I.grid },
  d3: { name: "تصميم ٣", icon: I.rows },
  classic: { name: "بسيط", icon: I.menu },
};

$("#yr").textContent = new Date().getFullYear();
$("#burger").innerHTML = I.menu;
$("#nsIc").innerHTML = I.search;
// البحث العلوي: يفلتر الرئيسية (ويرجع لها إذا بصفحة ثانية)
$("#navq").value = state.q;
$("#navq").oninput = (e) => {
  state.q = e.target.value;
  if (location.pathname === "/" && homeDraw) { const hq = $("#q"); if (hq) hq.value = state.q; homeDraw(); }
  else if (location.pathname !== "/") go("/");
};
$("#lbX").innerHTML = I.x;
$("#lbP").innerHTML = I.up.replace("m6 15 6-6 6 6", "m9 6 6 6-6 6");
$("#lbN").innerHTML = I.up.replace("m6 15 6-6 6 6", "m15 6-6 6 6 6");
$("#burger").onclick = () => $("#navLinks").classList.toggle("open");
addEventListener("scroll", () => $("#nav").classList.toggle("scrolled", scrollY > 10), { passive: true });

/* ---------- اختيار التصميم (بالشريط العلوي) ---------- */
const curLayout = () => { if (state.layout) return state.layout; let l = null; try { l = localStorage.getItem("ib_layout"); } catch {} return l || S.layout || "classic"; };
function drawLayMenu() {
  const m = $("#layMenu"); if (!m) return;
  const cur = curLayout();
  m.innerHTML = `<div style="padding:6px 10px;color:var(--dim);font-size:.78rem">ترتيب الصفحة</div>` +
    Object.entries(LAYOUTS).map(([k, v]) => `<button data-layout="${k}" class="${cur === k ? "on" : ""}">${v.icon}${v.name}${cur === k ? " ✔" : ""}</button>`).join("");
}
(function setupLayoutPicker() {
  const btn = $("#layBtn"), m = $("#layMenu"); if (!btn) return;
  btn.innerHTML = I.layout;
  drawLayMenu();
  btn.onclick = (e) => { e.stopPropagation(); m.classList.toggle("open"); drawLayMenu(); };
  m.onclick = (e) => { const b = e.target.closest("[data-layout]"); if (!b) return; state.layout = b.dataset.layout; try { localStorage.setItem("ib_layout", state.layout); } catch {} m.classList.remove("open"); if (location.pathname === "/") renderHome(); };
  document.addEventListener("click", (e) => { if (!m.contains(e.target) && e.target !== btn) m.classList.remove("open"); });
})();

/* ---------- التنقل ---------- */
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-link]");
  if (!a || e.ctrlKey || e.metaKey) return;
  e.preventDefault();
  go(a.getAttribute("href"));
});
function go(href) { history.pushState(null, "", href); route(); scrollTo({ top: 0, behavior: "smooth" }); }
addEventListener("popstate", route);

function setMeta(title, desc, kw) {
  document.title = title;
  const set = (sel, attr, v) => { const el = document.head.querySelector(sel); if (el && v) el.setAttribute(attr, v); };
  set('meta[name="description"]', "content", desc);
  set('meta[property="og:title"]', "content", title);
  set('meta[property="og:description"]', "content", desc);
  if (kw) set('meta[name="keywords"]', "content", kw);
}

async function route() {
  $("#navLinks").classList.remove("open");
  const p = decodeURI(location.pathname);
  const nav = p.startsWith("/requests") ? "requests" : p.startsWith("/about") ? "about" : p.startsWith("/app/") ? "" : "home";
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("active", a.dataset.nav === nav));
  document.body.classList.toggle("is-home", nav === "home");
  if (nav !== "home") homeDraw = null;
  try {
    if (p.startsWith("/app/")) return await renderApp(p.slice(5));
    if (p.startsWith("/requests")) return await renderRequests();
    if (p.startsWith("/about")) return await renderAbout();
    return await renderHome();
  } catch (e) {
    view.innerHTML = `<div class="empty"><div class="big">⚠️</div>${esc(e.message)}<br><br><a class="btn" href="/" data-link>الرئيسية</a></div>`;
  }
}

async function loadApps() { if (!APPS) APPS = await api("/apps"); return APPS; }

const iconHTML = (a) => a.icon ? `<div class="app-icon"><img src="${esc(a.icon)}" alt="${esc(a.name)}" loading="lazy"></div>` : `<div class="app-icon">${esc((a.name || "?").trim()[0])}</div>`;
const platIcons = (a) => `<div class="plat-icons">${Object.keys(a.platforms || {}).map((p) => `<span title="${PLATFORMS[p]?.name || p}">${I[p] || I.download}</span>`).join("")}</div>`;

/* ---------- الرئيسية ---------- */
/* ===== النجوم ===== */
const STAR = '<svg viewBox="0 0 24 24" class="st"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const starDisplay = (r) => {
  const avg = r?.avg || 0, c = r?.count || 0, n = Math.round(avg);
  let s = ""; for (let i = 1; i <= 5; i++) s += STAR.replace("class=\"st\"", `class="st ${i <= n ? "f" : ""}"`);
  return `<span class="rating"><span class="stars">${s}</span>${c ? `<span class="rnum">${avg.toFixed(1)} <small>(${c})</small></span>` : `<span class="rnum dimtxt">جديد</span>`}</span>`;
};

/* ===== بطاقات البرامج ===== */
const cardGrid = (a, i = 0) => `
  <article class="card glass fade" style="animation-delay:${Math.min(i, 12) * 40}ms" data-slug="${esc(a.slug)}">
    ${a.featured ? '<span class="badge-feat">مميز</span>' : ""}
    <div class="top">${iconHTML(a)}<div><h3>${esc(a.name)}</h3>${a.category ? `<span class="chip" style="margin-top:4px">${esc(a.category)}</span>` : ""}</div></div>
    <p class="tag">${esc(a.tagline || a.description?.slice(0, 120) || "")}</p>
    ${starDisplay(a.rating)}
    <div class="bottom">${platIcons(a)}<span class="dl-count">${I.download}${fmtNum(a.downloads)}</span></div>
  </article>`;
const cardStore = (a, i = 0) => `
  <article class="scard glass fade" style="animation-delay:${Math.min(i, 12) * 40}ms" data-slug="${esc(a.slug)}">
    ${a.featured ? '<span class="ribbon">مميز</span>' : ""}
    <div class="si">${iconHTML(a)}</div>
    <h3>${esc(a.name)}</h3>
    <p>${esc(a.tagline || a.description?.slice(0, 70) || "")}</p>
    ${starDisplay(a.rating)}
    <div class="smeta"><span>${platIcons(a)}</span><span class="dl-count">${I.download}${fmtNum(a.downloads)}</span>${a.size ? `<span class="chip">${esc(a.size)}</span>` : ""}</div>
    <span class="btn gold sm dlbtn">${I.download} تحميل الآن</span>
  </article>`;
const cardCover = (a, i = 0) => `
  <article class="card ccard glass fade" style="animation-delay:${Math.min(i, 12) * 40}ms" data-slug="${esc(a.slug)}">
    ${a.featured ? '<span class="badge-feat" style="z-index:2">مميز</span>' : ""}
    <div class="cv" style="background-image:url('${esc(a.cover || a.screenshots?.[0] || a.icon || "")}')"></div>
    <div class="cbody">
      <div class="top">${iconHTML(a)}<div><h3>${esc(a.name)}</h3>${a.category ? `<span class="chip" style="margin-top:4px">${esc(a.category)}</span>` : ""}</div></div>
      <p class="tag">${esc(a.tagline || a.description?.slice(0, 120) || "")}</p>
      <div class="bottom">${platIcons(a)}<span class="dl-count">${I.download}${fmtNum(a.downloads)}</span></div>
    </div>
  </article>`;
const rowList = (a) => `
  <article class="lrow glass fade" data-slug="${esc(a.slug)}">
    ${iconHTML(a)}
    <div class="lx"><h3>${esc(a.name)} ${a.featured ? '<span class="chip gold" style="font-size:.7rem">مميز</span>' : ""}</h3><p>${esc(a.tagline || a.description?.slice(0, 160) || "")}</p>
      <div style="display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap">${a.category ? `<span class="chip">${esc(a.category)}</span>` : ""}${a.version ? `<span class="chip">${esc(a.version)}</span>` : ""}</div></div>
    <div class="lr">${platIcons(a)}<span class="dl-count">${I.download}${fmtNum(a.downloads)}</span><span class="btn gold sm">تحميل</span></div>
  </article>`;

async function renderHome() {
  setMeta(`${S.siteName} — ${S.siteSubtitle}`, S.heroText);
  if (!APPS) view.innerHTML = '<div class="spinner"></div>';
  const apps = await loadApps();
  const totalDl = apps.reduce((s, a) => s + (a.downloads || 0), 0);
  const plats = [...new Set(apps.flatMap((a) => Object.keys(a.platforms || {})))];
  const catCount = {};
  for (const a of apps) for (const c of appCats(a)) catCount[c] = (catCount[c] || 0) + 1;
  const cats = Object.keys(catCount);
  const recent = [...apps].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")).slice(0, 5);
  if (!state.view) { let v = null; try { v = localStorage.getItem("ib_view"); } catch {} state.view = v || S.view || "grid"; }
  if (!state.layout) { let l = null; try { l = localStorage.getItem("ib_layout"); } catch {} state.layout = l || S.layout || "classic"; }
  const L = state.layout;

  /* ---- كتل مشتركة ---- */
  const hero = () => `
    <section class="hero-mini fade">
      <div class="hm-text">
        <h1><span class="gold-text">${esc(S.heroTitle)}</span></h1>
        <p>${esc(S.heroText)}</p>
      </div>
      <div class="badges">
        <span>${I.shield} مواقع آمنة</span><span>${I.download} روابط مباشرة</span>
        <span>${I.fire} تحميل سريع</span><span>${I.windows} متوافق مع ويندوز</span>
      </div>
      ${S.notice ? `<div class="notice" style="margin-top:12px">${esc(S.notice)}</div>` : ""}
    </section>`;
  const catStrip = () => cats.length ? `
    <div class="catstrip">
      <button data-c="all" class="cs ${state.cat === "all" ? "on" : ""}">${I.grid}<span>جميع الأقسام</span></button>
      ${cats.map((c) => `<button data-c="${esc(c)}" class="cs ${state.cat === c ? "on" : ""}">${catIcon(c)}<span>${esc(c)}</span></button>`).join("")}
    </div>` : "";
  const statsBar = () => `
    <section class="statsbar glass fade">
      <div><b class="gold-text">${fmtNum(totalDl)}+</b><span>تحميل</span></div>
      <div><b class="gold-text">${apps.length}+</b><span>برنامج</span></div>
      <div><b class="gold-text">${plats.length}</b><span>منصة</span></div>
      <div><b class="gold-text">100%</b><span>آمن</span></div>
    </section>`;
  const catSidebar = () => `
    <aside class="side-box glass">
      <h3 class="sb-h">${I.folder} التصنيفات</h3>
      <div class="catlist">
        <button data-c="all" class="${state.cat === "all" ? "on" : ""}"><span>${I.grid} كل البرامج</span><b>${apps.length}</b></button>
        ${cats.map((c) => `<button data-c="${esc(c)}" class="${state.cat === c ? "on" : ""}"><span>${catIcon(c)} ${esc(c)}</span><b>${catCount[c]}</b></button>`).join("")}
      </div>
    </aside>`;
  const recentSidebar = () => `
    <aside class="side-box glass">
      <h3 class="sb-h">${I.clock} أحدث الإضافات</h3>
      <div class="recentlist">
        ${recent.map((a) => `<a class="ritem" data-slug="${esc(a.slug)}">${iconHTML(a)}<div><b>${esc(a.name)}</b><small>${fmtAgo(a.updatedAt || a.createdAt)}</small></div></a>`).join("")}
      </div>
    </aside>`;
  const SORTS = { default: ["المميزة", I.star], downloads: ["الأكثر تحميلاً", I.fire], new: ["أحدث الإضافات", I.clock], featured: ["الموصى بها", I.medal] };
  const filterSidebar = () => `
    <aside class="side-box glass">
      <h3 class="sb-h">${I.layout} تصفية</h3>
      <div class="sortlist">
        ${Object.entries(SORTS).map(([k, [n, ic]]) => `<button data-sort="${k}" class="${state.sort === k ? "on" : ""}">${ic} ${n}</button>`).join("")}
      </div>
      <div class="dlcounter"><span>إجمالي التحميلات</span><b class="gold-text">${fmtNum(totalDl)}+</b></div>
    </aside>`;

  /* ---- هيكل حسب التصميم ---- */
  const viewbar = L === "classic" ? `<div class="viewbar" id="vb">${Object.entries(VIEWS).map(([k, v]) => `<button data-view="${k}" class="${state.view === k ? "on" : ""}" title="${v.name}">${v.icon}<span class="vbl">${v.name}</span></button>`).join("")}</div>` : "";
  const platRow = `<div class="filters" id="pf"><button data-p="all" class="${state.plat === "all" ? "on" : ""}">${I.grid} الكل</button>${Object.keys(PLATFORMS).filter((p) => plats.includes(p)).map((p) => `<button data-p="${p}" class="${state.plat === p ? "on" : ""}">${I[p]} ${PLATFORMS[p].name}</button>`).join("")}</div>`;

  let body;

    body = hero() + catStrip() + `

    body = hero() + catStrip() + `
      <section class="section d2wrap">
        ${catSidebar()}

        ${recentSidebar()}

  } else if (L === "d3") {
    body = hero() + catStrip() + `
      <section class="section d3wrap">
        <div class="d3main">${headRow("أحدث البرامج المضافة", I.clock)}${platRow}<div class="grid" id="grid"></div></div>

      </section>`;
  } else {
    body = hero() + statsBar() + `
      <section class="section" style="padding-top:18px">
        ${platRow}
        ${cats.length > 1 ? `<div class="filters" id="cf"><button data-c="all" class="${state.cat === "all" ? "on" : ""}">كل الأقسام</button>${cats.map((c) => `<button data-c="${esc(c)}" class="${state.cat === c ? "on" : ""}">${esc(c)}</button>`).join("")}</div>` : ""}
        ${viewbar}

        <div class="grid" id="grid"></div>
      </section>`;
  }
  view.innerHTML = body;
  $("#layBtn") && drawLayMenu();

  const draw = () => {
    const q = state.q.trim().toLowerCase();
    let list = apps.filter((a) =>
      (state.plat === "all" || a.platforms?.[state.plat]) &&
      (state.cat === "all" || appCats(a).includes(state.cat)) &&
      (!q || [a.name, a.tagline, a.description, a.category, ...(a.keywords || [])].join(" ").toLowerCase().includes(q)));
    if (state.sort === "downloads") list.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
    else if (state.sort === "new") list.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
    else if (state.sort === "featured") list.sort((a, b) => (b.featured - a.featured) || (b.downloads || 0) - (a.downloads || 0));
    const grid = $("#grid");
    // التصميم الكلاسيكي: البطاقة المميزة + أوضاع العرض
    if (L === "classic") {
      const feat = apps.find((a) => a.featured);
      const showFeat = feat && !q && state.plat === "all" && state.cat === "all" && state.view !== "list";
      $("#featBox").innerHTML = showFeat ? `
        <div class="featured glass fade" data-slug="${esc(feat.slug)}">
          <div class="media" style="background-image:url('${esc(feat.cover || feat.screenshots?.[0] || feat.icon || "")}')"></div>
          <div class="info"><span class="chip gold" style="align-self:flex-start">${I.star} البرنامج المميز</span>
            <div style="display:flex;gap:14px;align-items:center">${iconHTML(feat)}<h2>${esc(feat.name)}</h2></div>
            <p class="sub">${esc(feat.tagline)}</p>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${platIcons(feat)}<span class="btn gold">${I.download} تحميل</span></div></div>
        </div>` : "";
      if (showFeat) list = list.filter((a) => a.id !== feat.id);
      if (!list.length) { grid.className = "grid"; grid.innerHTML = showFeat ? "" : emptyMsg(apps.length); return; }
      if (state.view === "list") { grid.className = "applist"; grid.innerHTML = list.map(rowList).join(""); }
      else if (state.view === "cover") { grid.className = "grid cover-grid"; grid.innerHTML = list.map(cardCover).join(""); }
      else if (state.view === "sections") {
        grid.className = "sections"; const g = {};
        for (const a of list) { const cs = appCats(a); (cs.length ? cs : ["غير مصنّف"]).forEach((c) => (g[c] = g[c] || []).push(a)); }
        grid.innerHTML = Object.entries(g).map(([c, arr]) => `<div class="cat-sec"><h2 class="cat-h">${esc(c)} <span class="chip" style="font-size:.72rem">${arr.length}</span></h2><div class="grid">${arr.map(cardGrid).join("")}</div></div>`).join("");
      } else { grid.className = "grid"; grid.innerHTML = list.map(cardGrid).join(""); }
      return;
    }
    // التصاميم الثلاثة: بطاقات المتجر
    grid.className = L === "d3" ? "store-grid tight" : "store-grid";
    grid.innerHTML = list.length ? list.map(cardStore).join("") : emptyMsg(apps.length);
  };
  const emptyMsg = (n) => `<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div>${n ? "ماكو نتائج، جرّب كلمة ثانية" : "قريباً… أول البرامج راح تنزل هنا"}</div>`;
  homeDraw = draw;
  const nq = $("#navq"); if (nq) nq.value = state.q;
  draw();

  // ربط الأحداث
  const setActive = (sel, el) => { view.querySelectorAll(sel).forEach((x) => x.classList.remove("on")); el && el.classList.add("on"); };
  $("#q") && ($("#q").oninput = (e) => { state.q = e.target.value; draw(); });
  view.querySelector("#pf") && (view.querySelector("#pf").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; state.plat = b.dataset.p; setActive("#pf button", b); draw(); });
  view.querySelector("#cf") && (view.querySelector("#cf").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; state.cat = b.dataset.c; setActive("#cf button", b); draw(); });
  $("#vb") && ($("#vb").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; state.view = b.dataset.view; try { localStorage.setItem("ib_view", state.view); } catch {} setActive("#vb button", b); draw(); });
  view.onclick = (e) => {
    const sortB = e.target.closest("[data-sort]");
    if (sortB) { state.sort = sortB.dataset.sort; setActive("[data-sort]", sortB); draw(); return; }
    const catB = e.target.closest("[data-c]");
    if (catB && !catB.closest("#cf")) { state.cat = catB.dataset.c; view.querySelectorAll("[data-c]").forEach((x) => x.classList.toggle("on", x.dataset.c === state.cat)); draw(); scrollToGrid(); return; }
    const card = e.target.closest("[data-slug]");
    if (card) go("/app/" + encodeURIComponent(card.dataset.slug));
  };
  function scrollToGrid() { const g = $("#grid"); if (g && (state.cat !== "all")) g.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

/* ---------- صفحة التطبيق ---------- */
function renderDesc(t) {
  // سطور تبدأ بـ - أو • تتحول لقائمة
  const lines = esc(t).split("\n");
  let out = "", inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*[-•*]\s+(.*)/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${m[1]}</li>`; }
    else { if (inList) { out += "</ul>"; inList = false; } out += l + "\n"; }
  }
  if (inList) out += "</ul>";
  return out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--gold3)">$1</a>');
}

      ${a.keywords?.length ? `<div class="box glass fade"><h2>كلمات مفتاحية</h2><div class="kw">${a.keywords.map((k) => `<a href="/" data-kw="${esc(k)}">#${esc(k)}</a>`).join("")}</div></div>` : ""}
    </div>

    <aside class="side">
      <div class="dl-panel glass" id="download">
        <h2>${I.download} روابط التحميل</h2>
        ${plats.length ? `
          <div class="ptabs" id="ptabs">${plats.map((p) => `<button data-p="${p}" class="${p === cur ? "on" : ""}">${I[p]} ${PLATFORMS[p].name}</button>`).join("")}</div>
          <div class="mirrors" id="mirrors"></div>

    const note = (a.platformNotes && a.platformNotes[cur]) || "";

      (a.platforms[cur] || []).map((l, i) => {
        const h = HOSTS[l.host] || HOSTS.other;

      }).join("");

  drawMirrors();
  $("#ptabs") && ($("#ptabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; cur = b.dataset.p; $("#ptabs .on").classList.remove("on"); b.classList.add("on"); drawMirrors(); });

  $("#mirrors") && ($("#mirrors").onclick = async (e) => {
    const b = e.target.closest("[data-report]"); if (!b) return;
    e.preventDefault();
    if (b.dataset.done) return;
    const note = (prompt("شنو المشكلة بالرابط؟ (اختياري — مثلاً: ما يفتح / محذوف / بطيء)", "") ?? "").slice(0, 300);
    b.disabled = true;
    try {
      await api("/report", { method: "POST", body: { appId: a.id, linkId: b.dataset.report, note } });

    copy(pageUrl);
  };

  // تقييم بالنجوم
  (() => {
    const box = $("#rateStars"), info = $("#rateInfo"); let mine = a.rating?.mine || 0;
    const paint = (hover) => { const v = hover || mine; box.querySelectorAll("button").forEach((b, i) => b.classList.toggle("f", i < v)); };

    paint(); status();
    box.querySelectorAll("button").forEach((b) => {
      b.onmouseenter = () => paint(+b.dataset.s);
      b.onmouseleave = () => paint();
      b.onclick = async () => {
        const s = +b.dataset.s;
        box.style.pointerEvents = "none";
        try { const r = await api(`/apps/${a.id}/rate`, { method: "POST", body: { stars: s } }); a.rating = { ...a.rating, ...r }; mine = r.mine; paint(); status(); toast("شكراً على تقييمك ✔"); }
        catch (er) { toast(er.message, true); }
        box.style.pointerEvents = "";
      };
    });
  })();

  // عارض الصور
  let li = 0;
  const lb = $("#lb"), img = $("#lbImg");
  const show = (i) => { li = (i + shots.length) % shots.length; img.src = shots[li]; lb.classList.add("open"); };
  view.querySelectorAll(".shots img").forEach((im) => (im.onclick = () => show(+im.dataset.i)));
  $("#lbX").onclick = () => lb.classList.remove("open");

  $("#lbP").onclick = () => show(li - 1);
  lb.onclick = (e) => { if (e.target === lb) lb.classList.remove("open"); };
  document.onkeydown = (e) => { if (!lb.classList.contains("open")) return; if (e.key === "Escape") lb.classList.remove("open"); if (e.key === "ArrowLeft") show(li + 1); if (e.key === "ArrowRight") show(li - 1); };
}

          <div class="rmeta">
            <span class="st st-${r.status}">${STATUS[r.status] || r.status}</span>
            ${r.platform ? `<span class="chip">${I[r.platform] || ""} ${PLATFORMS[r.platform]?.name || r.platform}</span>` : ""}
            <span>${r.registered ? "👤 " : ""}${esc(r.author)}</span><span>·</span><span>${fmtDate(r.createdAt)}</span>
          </div>
          ${r.reply ? `<div class="reply"><b>رد المطور:</b> ${esc(r.reply)}</div>` : ""}
          ${r.app ? `<a class="done-app" href="/app/${encodeURIComponent(r.app.slug)}" data-link>${r.app.icon ? `<img src="${esc(r.app.icon)}" alt="">` : `<span class="di">${esc((r.app.name || "?")[0])}</span>`}<span class="dt"><b>✅ تم عمل التطبيق — ${esc(r.app.name)}</b><small>اضغط للتحميل من صفحة البرنامج</small></span>${I.download}</a>` : ""}
        </div>
      </div>`).join("") : `<div class="empty"><div class="big">💡</div>ماكو طلبات بعد — كون أول واحد يطلب!</div>`;
  };
  const loadList = async () => { try { all = await api("/requests"); drawList(); } catch (e) { $("#reqList").innerHTML = `<div class="empty">${esc(e.message)}</div>`; } };
  loadList();

  $("#rf").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; filt = b.dataset.s; $("#rf .on").classList.remove("on"); b.classList.add("on"); drawList(); };
  $("#reqList").onclick = async (e) => {
    const b = e.target.closest("[data-v]"); if (!b) return;
    try { const r = await api(`/requests/${b.dataset.v}/vote`, { method: "POST" }); const i = all.findIndex((x) => x.id === r.id); all[i] = r; drawList(); } catch (er) { toast(er.message, true); }
  };
  $("#reqForm").onsubmit = async (e) => {
    e.preventDefault();
    if (mode === "account" && !USER) return toast("سجّل دخول أولاً أو اختار بدون تسجيل", true);
    const fd = Object.fromEntries(new FormData(e.target));
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true;
    try {
      const r = await api("/requests", { method: "POST", body: fd });
      all.unshift(r); drawList(); e.target.reset(); drawWho();
      toast("وصل طلبك ✔ شكراً إلك");
    } catch (er) { toast(er.message, true); }
    btn.disabled = false;
  };
}

/* ---------- تسجيل الدخول ---------- */
function openAuth(done) {
  const m = $("#authModal"), f = $("#authForm");
  let reg = false;
  const set = (r) => {
    reg = r;
    $("#tabLogin").classList.toggle("on", !r); $("#tabReg").classList.toggle("on", r);
    $("#fName").hidden = !r; $("#authTitle").textContent = r ? "حساب جديد" : "تسجيل الدخول";
    $("#authBtn").textContent = r ? "إنشاء الحساب" : "دخول";
    f.password.autocomplete = r ? "new-password" : "current-password";
  };
  set(false);
  $("#tabLogin").onclick = () => set(false);
  $("#tabReg").onclick = () => set(true);
  $("#authClose").onclick = () => m.classList.remove("open");
  m.onclick = (e) => { if (e.target === m) m.classList.remove("open"); };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(f));
    try {
      const r = await api(reg ? "/register" : "/login", { method: "POST", body: fd });
      try { localStorage.setItem("ib_token", r.token); } catch {}
      USER = r.user; m.classList.remove("open"); f.reset();
      toast(`أهلاً ${USER.name} 👋`); done && done();
    } catch (er) { toast(er.message, true); }
  };
  m.classList.add("open");
  setTimeout(() => f.username.focus(), 50);
}

    S.instagram && `<a class="btn" href="${esc(S.instagram)}" target="_blank" rel="noopener">${I.image} انستكرام</a>`,
    S.facebook && `<a class="btn" href="${esc(S.facebook)}" target="_blank" rel="noopener">${I.share} فيسبوك</a>`,
    S.phone && `<a class="btn" href="tel:${esc(S.phone)}">${I.chat} ${esc(S.phone)}</a>`,
  ].filter(Boolean).join("");
  view.innerHTML = `
  <section class="dev glass fade">
    <div class="dev-avatar"><span class="gold-text">IB</span></div>
    <div>
      <span class="chip gold">المطوّر</span>
      <h1 class="gold-text" style="margin-top:8px">${esc(S.developerName)}</h1>
      <p class="desc" style="margin-top:8px">${esc(S.developerBio)}</p>

  </section>
  <div class="stats fade" style="margin-top:30px">
    <div><b class="gold-text">${apps.length}</b><span>برنامج منشور</span></div>
    <div><b class="gold-text">${fmtNum(dl)}</b><span>تحميل</span></div>
  </div>
  <section class="credit glass fade">
    <div class="big">حول</div>
    <p style="font-size:1.15rem">برمجة وتطوير <b class="gold-text">ابراهيم الخزرجي</b></p>
    <p class="sub" style="margin-top:8px">تيليكرام: <a href="https://t.me/ibraprogram" target="_blank" rel="noopener" style="color:var(--gold3)" dir="ltr">t.me/ibraprogram</a> · تيك توك: <a href="https://www.tiktok.com/@ibraprogram" target="_blank" rel="noopener" style="color:var(--gold3)" dir="ltr">ibraprogram</a></p>
    <div style="margin-top:18px"><a class="btn" href="/requests" data-link>${I.chat} عندك فكرة تطبيق؟ اطلبه</a></div>
  </section>`;

  S = { siteName: "IBRA STORE", siteSubtitle: "برامج وتطبيقات ابراهيم الخزرجي", heroTitle: "برامجي وتطبيقاتي بمكان واحد", heroText: "", developerName: "ابراهيم الخزرجي", developerBio: "", ...S };
  $("#siteName").textContent = S.siteName; $("#siteSub").textContent = S.siteSubtitle;
  if (S.telegram) $("#fTg").href = S.telegram;
  if (S.tiktok) $("#fTt").href = S.tiktok;

  IB.mountThemePicker($("#themeBtn"), $("#themeMenu"), { current: IB.savedTheme() || S.theme || "gold" });
